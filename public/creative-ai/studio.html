<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creative AI</title>
  <link rel="icon" type="image/svg+xml" href="/creative-ai/assets/creative-ai-icon-02b.svg">
  <link rel="stylesheet" href="/creative-ai/editable-canvas.css">
  <link rel="stylesheet" href="/creative-ai/studio.css">
  <link rel="stylesheet" href="/creative-ai/studio-motion.css">
</head>
<body class="studio-preview">
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="app-sidebar" aria-label="Workspace menu">
    <a class="wordmark" href="#home" aria-label="Creative AI home" title="Creative AI"><img class="creative-ai-symbol" src="/creative-ai/assets/creative-ai-logo-02b.svg" alt="" width="34" height="34"><span class="nav-label">Creative AI</span></a>
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebarNavigation" title="Collapse sidebar"></button>
    <nav id="sidebarNavigation" aria-label="Main navigation"></nav>
    <div class="sidebar-footer"></div>
    <button id="accountTrigger" class="account-trigger" popovertarget="accountMenu" aria-label="Open profile and settings" title="Profile and settings"><span class="account-avatar" aria-hidden="true">N</span><span class="nav-label account-label"><strong id="accountName">Neha</strong><small>Local preview</small></span><span class="nav-label account-more" aria-hidden="true">···</span></button>
  </aside>
  <div class="app-shell">
  <header class="app-header">
    <button class="workspace-search" data-action="workspace-search" aria-label="Search campaigns, SKUs, files and tags"><span id="searchIcon"></span><span>Search campaigns, SKUs, files and tags…</span></button>
    <div class="header-end"><div id="brandSwitch" class="brand-switch" role="group" aria-label="Brand"></div></div>
  </header>
  <main id="main" tabindex="-1"><div class="workspace-loader" role="status" aria-live="polite"><span class="workspace-spinner" aria-hidden="true"></span><strong>Opening your workspace…</strong><p>Your saved work will appear here shortly.</p></div></main>
  </div>
  <div id="accountMenu" class="account-menu" popover="auto" aria-label="Profile and settings"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <section id="taskPanel" class="task-panel" aria-labelledby="taskTitle" hidden></section>
  <script defer src="/creative-ai/vendor/lottie.min.js"></script>
  <script defer src="/creative-ai/studio-motion.js"></script>
  <script src="/creative-ai/session.js"></script>
  <script src="/creative-ai/studio-model.js"></script>
  <script src="/creative-ai/studio-data.js"></script>
  <script src="/creative-ai/studio-documents.js"></script>
  <script src="/creative-ai/vendor/fabric.min.js"></script>
  <script src="/creative-ai/canvas-model.js"></script>
  <script src="/creative-ai/editable-canvas.js"></script>
  <script src="/creative-ai/studio-library.js"></script>
<script src="/creative-ai/studio-creative-feedback.js"></script>
<script src="/creative-ai/studio.js"></script>
<script src="/creative-ai/studio-selects.js"></script>
</body>
</html>
