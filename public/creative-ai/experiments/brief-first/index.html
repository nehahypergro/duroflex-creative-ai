body{margin:0;background:#fff;color:#242139;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}.lab-sidebar{position:fixed;width:200px;inset:0 auto 0 0;border-right:1px solid #e7e1ef;padding:28px 18px;background:#fff}.lab-logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:750;margin-bottom:40px}.lab-logo img{width:30px}.lab-nav{display:block;padding:12px;border-radius:9px;color:#716a82;font-size:13px;margin-bottom:5px}.lab-nav.active{color:#713bd0;background:#f2ebff}.lab-avatar{position:absolute;bottom:26px;font-size:13px}.lab-shell{margin-left:200px}.lab-header{height:82px;border-bottom:1px solid #e7e1ef;display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:20px}.lab-tag{font-size:11px;color:#795a9d;background:#f4edff;padding:7px 11px;border-radius:20px}.brand{color:#e42218;font-size:20px;font-weight:750}.lab-main{max-width:1080px;margin:auto;padding:32px 48px 80px}.steps{display:flex;gap:24px;font-size:12px;color:#a19aaa;margin-bottom:38px}.steps .active{color:#713bd0;font-weight:700}.intro{text-align:center;margin:55px auto 30px;max-width:650px}.eyebrow{color:#8b6ca9;font-size:11px;font-weight:650;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:38px;line-height:1.15;letter-spacing:-1.3px;margin:14px 0}p{line-height:1.6}.muted{color:#777086;font-size:14px}.brief-box{border:1px solid #d9cceb;box-shadow:0 8px 32px #613a9810;border-radius:20px;padding:24px;max-width:760px;margin:auto}.brief-box textarea{width:100%;min-height:160px;resize:vertical;border:0;outline:none;font-size:17px;line-height:1.65;color:#332a43;background:transparent}.brief-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee8f5;padding-top:18px;gap:12px}.primary,.secondary{border-radius:9px;padding:12px 20px;font-size:13px;font-weight:600}.primary{background:#713bd0;border:1px solid #713bd0;color:white}.secondary{border:1px solid #ded5e9;background:white;color:#68438e}.text-action{border:0;background:transparent;color:#713bd0;font-size:12px;padding:6px}.example{margin:20px auto;text-align:center;font-size:12px;color:#91849d}.example button{color:#713bd0;background:none;border:0;font-size:12px}.plan-header{max-width:760px;margin-bottom:26px}.plan-header h1{font-size:32px}.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.card{border:1px solid #e5deed;border-radius:15px;padding:24px;margin-bottom:18px}.card h2{font-size:18px;margin:0 0 14px;letter-spacing:-.4px}.recommendation{background:linear-gradient(120deg,#f7f2ff,#fff);border-color:#e0d1f1}.recommendation h2{font-size:25px;line-height:1.3}.row{display:flex;gap:14px;justify-content:space-between;align-items:center}.asset{border-top:1px solid #eee8f3;padding:15px 0;display:flex;gap:12px;align-items:center}.asset:last-child{padding-bottom:0}.asset-icon{width:38px;height:42px;border-radius:8px;background:#f3ebfc;display:grid;place-items:center;color:#8656b3;flex:none}.asset-copy{flex:1}.asset strong{font-size:13px;display:block}.asset small{color:#81768c;font-size:12px;display:block;margin-top:5px}.remove{background:none;border:1px solid #e7deef;border-radius:50%;width:25px;height:25px;color:#8a7a98}.insight{background:#faf8fd;border:0}.insight p{font-size:13px;color:#73657f}.facts{font-size:13px}.facts div{padding:12px 0;border-bottom:1px solid #ece5f3}.facts small{display:block;color:#94869f;margin-bottom:5px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:24px;gap:16px}.edit-form{display:grid;gap:15px}.edit-form label{font-size:12px;color:#786784;display:grid;gap:7px}.edit-form input,.edit-form textarea,.edit-form select{border:1px solid #dcd0e7;border-radius:8px;padding:10px;color:#32273e;width:100%;background:white}.edit-form textarea{min-height:85px}dialog{border:1px solid #e5d9ef;border-radius:18px;padding:28px;width:min(520px,90vw);max-height:85vh}dialog::backdrop{background:#2d1a3d55}.notice{padding:14px 18px;border-radius:10px;background:#f6f0fe;color:#705186;font-size:13px}.review-brief{white-space:pre-wrap;font-size:14px;color:#655671}.attachment{font-size:12px;color:#82718f}a{color:#713bd0}.back{border:0;background:none;color:#8a739c;font-size:12px;padding:0}.finish{text-align:center;padding:65px 25px}.finish h1{font-size:30px}.finish .primary{margin-top:20px}@media(max-width:800px){.lab-sidebar{display:none}.lab-shell{margin:0}.lab-header{padding:0 20px}.lab-main{padding:24px 20px}.plan-grid{grid-template-columns:1fr}.intro{margin-top:25px}h1{font-size:30px}.steps{gap:14px}.brief-footer{flex-wrap:wrap}.plan-grid aside{order:2}.bottom{flex-wrap:wrap}}

.plan-header{display:block!important;width:100%!important;min-width:0!important;max-width:760px!important}.lab-main{max-width:1080px!important}.lab-main .plan-grid{grid-template-columns:minmax(0,1fr) 260px}@media(max-width:800px){.lab-main .plan-grid{grid-template-columns:minmax(0,1fr)}.steps{flex-wrap:wrap}.card .row{flex-wrap:wrap}} .suggestion-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.suggestion-grid small{font-size:11px;color:#907c9e}.suggestion-grid p{font-size:13px;margin:5px 0}.suggested-settings summary{font-size:12px;color:#713bd0;cursor:pointer}.suggested-settings details{border-top:1px solid #eee6f4;padding-top:16px}.suggested-settings details[open] .facts{margin-top:12px}@media(max-width:500px){.suggestion-grid{grid-template-columns:1fr}}

(0,1fr))}.compact-plan-heading{align-items:flex-start;flex-direction:column}.asset-options{grid-template-columns:1fr}.lab-main{padding:22px 16px}.asset-options .asset{padding:12px}}
</style></head><body><aside class="lab-sidebar"><div class="lab-logo"><img src="../../assets/creative-ai-logo-02b.svg" alt="">Creative AI</div><span class="lab-nav active">⌂ &nbsp; Home</span><span class="lab-nav">▱ &nbsp; Projects</span><span class="lab-nav">♡ &nbsp; Favourites</span><span class="lab-nav">▤ &nbsp; Brand Library</span><div class="lab-avatar">N &nbsp; Neha<br><small class="muted">&nbsp; &nbsp; Administrator</small></div></aside><div class="lab-shell"><header class="lab-header"><span class="lab-tag">Brief-first · isolated experiment</span><a href="mockups.html" style="font-size:12px;color:#713bd0">Compare 4 brief styles ↗</a><span class="brand">DUROFLEX</span></header><main class="lab-main" id="app"></main></div><dialog id="edit"><form method="dialog" id="edit-form"></form></dialog><script>
const state={step:0,brief:'',objective:'Product consideration',audience:'People comparing mattress comfort and firmness',product:'Airboost 6.8',approach:'Lead with comfort choice.',message:'Choose the comfort that suits you.',insight:'People comparing mattresses need a clear reason to explore. Make the firmness choice tangible, then give them a simple next step.',assets:['Social post','Story','Website banner'],files:[],language:'English',market:'Pan India',ageGroups:'Adults · no age restriction suggested',features:'Firm and medium-firm comfort options',tone:'Clear, reassuring and product-led',cta:'Explore Airboost 6.8',wordingMode:'Suggest copy; preserve any exact supplied wording',mandatoryInfo:'None extracted in this sample',variant:'Use product-level imagery; confirm a variant only if its appearance or offer differs',visualDirection:'Show the mattress clearly; make the firmness choice easy to understand',people:'Include people only if they help explain the benefit',destination:'Official product page · exact link to be verified',alternatives:'1 recommended direction',placementDetails:'Use each placement’s saved size, safe areas, viewing and logo rules',backgroundBrief:'People comparing mattresses need a clear way to choose the comfort that suits them.',offer:'No offer suggested without supplied evidence'};
const descriptions={'Social post':'Introduce the benefit in the feed.','Story':'Explain the comfort choice in a quick sequence.','Website banner':'Give interested shoppers a next step.','WhatsApp card':'Share the key benefit in a conversation.','LinkedIn post':'Introduce the product to a professional audience.'};const el=document.getElementById('app'),dialog=document.getElementById('edit');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recommendationFields={language:'Language',market:'Markets',ageGroups:'Age groups',features:'Features to highlight',tone:'Tone',cta:'Desired action / CTA',wordingMode:'Copy treatment',mandatoryInfo:'Mandatory information',variant:'Product variant',visualDirection:'Visual direction',people:'People in the artwork',destination:'Destination',alternatives:'Creative directions',placementDetails:'Format requirements',backgroundBrief:'Customer insight',offer:'Offer & conditions'};
function recommendations(){return `<section class="card suggested-settings"><div class="row"><h2>The details, taken care of.</h2><button class="text-action" data-edit="settings">Correct details</button></div><p class="muted">Suggested for this example. Your explicit instructions take priority.</p><div class="suggestion-grid">${['backgroundBrief','features','cta','language','market','tone','alternatives'].map(k=>`<div><small>${escape(recommendationFields[k])} · Suggested</small><p>${escape(state[k])}</p></div>`).join('')}</div><details><summary>See all brief details</summary><div class="facts">${Object.keys(recommendationFields).filter(k=>!['backgroundBrief','features','cta','language','market','tone','alternatives'].includes(k)).map(k=>`<div><small>${escape(recommendationFields[k])}</small>${escape(state[k])}</div>`).join('')}</div></details></section>`}
function assetList(editable=true){return state.assets.map((a,i)=>`<div class="asset"><span class="asset-icon">${a==='Story'?'▯':'▧'}</span><div class="asset-copy"><strong>${escape(a)}</strong><small>${escape(descriptions[a])}</small></div>${editable?`<button class="remove" data-remove="${i}" aria-label="Remove ${escape(a)}">−</button>`:''}</div>`).join('')}
function render(){el.innerHTML=`<div class="steps"><span class="${state.step===0?'active':''}">1 &nbsp; Your brief</span><span class="${state.step===1?'active':''}">2 &nbsp; Our recommendation</span><span class="${state.step>=2?'active':''}">3 &nbsp; Review & create</span></div>`+(state.step===0?`<div class="intro"><span class="eyebrow">Start with what you want to achieve</span><h1>What’s your brief?</h1><p class="muted">Tell us what you have in mind. We’ll recommend the approach<br>and the assets to bring it to life.</p></div><section class="brief-box"><textarea id="brief" aria-label="What’s your brief?" placeholder="A product launch, a store opening, a campaign idea…">${escape(state.brief)}</textarea><div class="attachment">${state.files.map(escape).join(' · ')}</div><div class="brief-footer"><label class="text-action" style="cursor:pointer">＋ Attach brief<input id="files" type="file" multiple hidden></label><button class="primary" data-next>Generate →</button></div></section><div class="example">Try an example: <button data-example>Introduce Airboost 6.8</button></div><p class="muted" style="text-align:center;font-size:11px;margin-top:30px">Prototype · sample recommendations, not AI analysis · attachments stay on this page</p>`:state.step===1?`<button class="back" data-back>← Back to your brief</button><div class="plan-header compact-plan-heading"><h1>Your recommended plan</h1><span class="muted">${escape(state.product)} · ${escape(state.objective)}</span></div><section class="card recommendation"><div class="row"><span class="eyebrow">Recommended message</span><button class="text-action" data-edit="approach">Edit approach</button></div><h2>${escape(state.message)}</h2><p class="muted">${escape(state.approach)} ${escape(state.insight)}</p></section><section class="card brief-overview"><div class="row"><h2>Brief details</h2><button class="text-action" data-edit="details">Correct details</button></div><div class="suggestion-grid"><div><small>Product / SKU</small><p>${escape(state.product)}</p></div><div><small>Objective · Suggested</small><p>${escape(state.objective)}</p></div><div><small>Audience · Suggested</small><p>${escape(state.audience)}</p></div>${['backgroundBrief','features','language','market','tone','cta'].map(k=>`<div><small>${escape(recommendationFields[k])} · Suggested</small><p>${escape(state[k])}</p></div>`).join('')}</div><details><summary>All brief details</summary><div class="suggestion-grid">${Object.keys(recommendationFields).filter(k=>!['backgroundBrief','features','language','market','tone','cta'].includes(k)).map(k=>`<div><small>${escape(recommendationFields[k])}</small><p>${escape(state[k])}</p></div>`).join('')}</div><button class="text-action" data-edit="settings">Correct additional details</button></details></section><section class="card compact-assets"><div class="row"><h2>Recommended assets</h2><button class="text-action" data-add>＋ Add asset</button></div><div class="asset-options">${assetList()}</div></section><section class="correction-section"><label for="correction">✦ Adjust the plan</label><div class="correction-bar"><input id="correction" placeholder="Tell us what to change…"><button class="primary" data-correct aria-label="Update plan">↑</button></div><div class="correction-chips"><button data-suggest="Make it more premium">Make it more premium</button><button data-suggest="Focus on store visits">Focus on store visits</button><button data-suggest="Use Hindi">Use Hindi</button></div><p id="correction-status" class="muted" role="status">Demo corrections: try premium, store visits or Hindi.</p></section><div class="bottom"><span class="muted">${state.assets.length} assets · one recommended direction</span><button class="primary" data-review>Review brief →</button></div>`:state.step===2?`<button class="back" data-back>← Back to recommendation</button><div class="plan-header"><span class="eyebrow">Ready when you are</span><h1>Your brief, brought together.</h1><p class="muted">One final look before creating your assets.</p></div><div class="plan-grid"><div><section class="card"><div class="row"><h2>Your request</h2><button class="text-action" data-original>Edit</button></div><p class="review-brief">${escape(state.brief)}</p>${state.files.length?`<p class="attachment">Attachments: ${state.files.map(escape).join(' · ')}</p>`:''}</section><section class="card"><h2>${escape(state.approach)}</h2><p>${escape(state.message)}</p><p class="muted">${escape(state.insight)}</p></section><section class="card"><h2>Assets to create</h2>${assetList(false)}</section>${recommendations()}</div><aside><section class="card facts"><h2>Details</h2><div><small>Brand</small>Duroflex</div><div><small>Product</small>${escape(state.product)}</div><div><small>Objective</small>${escape(state.objective)}</div><div><small>Audience</small>${escape(state.audience)}</div></section></aside></div><div class="bottom"><span class="muted">Prototype preview · no generation charges</span><button class="primary" data-create>Create creatives →</button></div>`:`<div class="finish"><span class="eyebrow">End of experiment</span><h1>This is where creation would begin.</h1><p class="muted">Your ${state.assets.length} chosen assets would enter the existing generation flow.<br>This prototype hasn’t created a project or started a paid request.</p><button class="primary" data-revisit>Return to the plan</button><p><button class="text-action" data-original>Try another brief</button></p></div>`);}
function edit(mode){let fields=mode==='approach'?['approach','message']:mode==='insight'?['insight']:mode==='settings'?Object.keys(recommendationFields):['product','objective','audience','backgroundBrief','cta'];document.getElementById('edit-form').innerHTML=`<div class="row"><h2>${mode==='details'?'Brief details':mode==='insight'?'The thought behind it':'Communication approach'}</h2><button value="cancel" aria-label="Close">×</button></div><div class="edit-form">${fields.map(k=>`<label>${recommendationFields[k]||k[0].toUpperCase()+k.slice(1)}<textarea name="${k}">${escape(state[k])}</textarea></label>`).join('')}</div><div class="bottom"><button value="cancel" class="secondary">Cancel</button><button value="save" class="primary">Save changes</button></div>`;dialog.showModal();dialog.onclose=()=>{if(dialog.returnValue==='save'){fields.forEach(k=>state[k]=document.querySelector(`[name=${k}]`).value);render();}}}
el.addEventListener('input',e=>{if(e.target.id==='brief')state.brief=e.target.value});el.addEventListener('change',e=>{if(e.target.id==='files'){state.files=[...e.target.files].map(f=>f.name);render();}});el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-correct')||b.dataset.suggest){const text=b.dataset.suggest||document.getElementById('correction').value,changes=[];if(/hindi/i.test(text)){state.language='Hindi';changes.push('Language changed to Hindi');}if(/premium/i.test(text)){state.tone='Refined, confident and understated';changes.push('Tone updated');}if(/store/i.test(text)){state.objective='Store visits';state.cta='Find your nearest Duroflex store';state.destination='Verified store locator or selected store';changes.push('Objective, CTA and destination updated');}render();document.getElementById('correction-status').textContent=changes.length?changes.join(' · ')+'. Review the updated details.':'This prototype supports the three example corrections. Use Correct details for other changes.';}else if(b.hasAttribute('data-example')){state.brief='Introduce Duroflex Airboost 6.8 to people comparing mattress comfort. Highlight its two firmness options and encourage them to explore the product.';render();}else if(b.hasAttribute('data-next')){if(!state.brief.trim()){document.getElementById('brief').focus();return;}state.step=1;render();scrollTo(0,0);}else if(b.hasAttribute('data-back')){state.step--;render();scrollTo(0,0);}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.remove!==undefined){state.assets.splice(Number(b.dataset.remove),1);render();}else if(b.hasAttribute('data-add')){const available=Object.keys(descriptions).filter(a=>!state.assets.includes(a));document.getElementById('edit-form').innerHTML='<h2>Add an asset</h2>'+available.map(a=>`<button class="secondary" style="display:block;margin:12px 0;width:100%" value="${escape(a)}">${escape(a)}</button>`).join('')+'<button value="cancel" class="text-action">Cancel</button>';dialog.onclose=()=>{if(available.includes(dialog.returnValue)){state.assets.push(dialog.returnValue);render();}};dialog.showModal();}else if(b.hasAttribute('data-review')){if(!state.assets.length){el.querySelector('[data-add]').focus();return;}state.step=2;render();scrollTo(0,0);}else if(b.hasAttribute('data-create')){state.step=3;render();scrollTo(0,0);}else if(b.hasAttribute('data-revisit')){state.step=1;render();}else if(b.hasAttribute('data-original')){state.step=0;render();}});render();
</script></body></html>
