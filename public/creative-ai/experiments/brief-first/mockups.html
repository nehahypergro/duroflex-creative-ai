<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four brief experiences · Creative AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:#27213a;font:14px Inter,system-ui,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e6e1ed;padding:20px 4%;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-weight:750;font-size:20px;display:flex;align-items:center;gap:10px}.logo img{width:30px}.tag{color:#8d7e9c;font-size:11px}.switcher{display:flex;justify-content:center;gap:8px;padding:22px;flex-wrap:wrap}.switcher button{border:1px solid #e0d9ea;background:white;color:#73657e;border-radius:22px;padding:11px 20px}.switcher button[aria-pressed=true]{background:#713bd0;color:white;border-color:#713bd0}.description{text-align:center;color:#8a7a97;font-size:12px;margin:0 auto 20px;max-width:700px;padding:0 20px}main{max-width:1180px;margin:0 auto 50px;padding:0 24px}.frame{background:white;border:1px solid #e2dce9;border-radius:16px;box-shadow:0 15px 45px #46305c0b;overflow:hidden}.topline{padding:20px 30px;border-bottom:1px solid #eee9f3;display:flex;justify-content:space-between;align-items:center;font-size:12px}.brand{font-weight:750;color:#e82c22}.body{padding:34px}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:10px;color:#9985aa;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:10px 0 12px}h2{font-size:17px;margin:0 0 15px}p{line-height:1.65;color:#7d708a}.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:26px}.box{border:1px solid #e5deed;border-radius:12px;padding:22px;margin-bottom:18px}.box.purple{background:#f7f1ff;border-color:#e5d4f7}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{font-size:10px;border-radius:14px;background:#f1e9fb;color:#8252b0;padding:5px 8px}.muted{font-size:12px;color:#95859f}.primary{background:#713bd0;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:12px;font-weight:650}.secondary{background:white;color:#713bd0;border:1px solid #ddd1ec;border-radius:8px;padding:10px 16px;font-size:12px}.text{background:none;color:#8053a8;border:0;font-size:12px;padding:4px}.footer{border-top:1px solid #eee8f4;display:flex;justify-content:space-between;align-items:center;padding:20px 30px;gap:15px}.asset{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #eee8f4}.asset i{display:grid;place-items:center;background:#f2ebfa;width:36px;height:40px;border-radius:7px;color:#9266b5;font-style:normal}.asset strong{font-size:12px}.asset small{display:block;font-size:11px;color:#9a88a7;margin-top:5px}.asset .text{margin-left:auto}.facts div{padding:12px 0;border-bottom:1px solid #eee8f4;font-size:12px}.facts small{display:block;font-size:10px;color:#a18cab;margin-bottom:6px}.agency{font-family:Georgia,serif}.agency .body{padding:40px 48px}.agency h1{font-size:39px;font-weight:400}.agency .eyebrow,.agency .topline,.agency .footer,.agency label,.agency button{font-family:Inter,system-ui,sans-serif}.agency .paper-row{display:grid;grid-template-columns:150px 1fr;border-top:1px solid #ddd6e5;padding:20px 0;gap:20px}.paper-row label{font-size:10px;letter-spacing:1px;color:#a28dab;text-transform:uppercase}.paper-row p{margin:0;font-size:16px;color:#53465e}.agency .grid{grid-template-columns:1fr 270px}.agency .box{border-radius:0;background:#fbf9fd}.modern .body{padding:38px}.modern h1{font-size:38px;max-width:650px}.modern .hero{background:linear-gradient(120deg,#f4eaff,#fcfbff);padding:30px;border-radius:16px;margin:22px 0}.modern .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:1px solid #e7deef;border-radius:12px;padding:20px;min-height:160px}.tile .visual{height:55px;background:#f4edfc;border-radius:7px;margin-bottom:15px;display:grid;place-items:center;color:#9c7bbb;font-size:24px}.ai .body{background:#fcfaff}.ai .conversation{max-width:700px}.chat-user{margin-left:90px;background:#f0eaf8;border-radius:14px;padding:18px;font-size:13px;line-height:1.65;margin-bottom:30px}.assistant{display:flex;gap:14px;align-items:flex-start}.spark{background:#713bd0;color:white;flex:none;border-radius:10px;width:32px;height:32px;display:grid;place-items:center}.ai h1{font-size:26px;margin-top:0}.ai .box{background:white}.ai .composer{border:1px solid #d7c5e8;border-radius:12px;background:white;padding:14px;display:flex;gap:10px;margin-top:24px}.composer input{width:100%;border:0;outline:none;background:none;font-size:12px}.saas .body{display:grid;grid-template-columns:170px minmax(0,1fr) 240px;gap:24px;padding:26px}.rail{border-right:1px solid #eee8f4;padding-right:20px}.rail div{padding:12px;font-size:12px;color:#9d8aaa;border-radius:8px;margin-bottom:5px}.rail .active{background:#f3ecfb;color:#713bd0;font-weight:650}.saas h1{font-size:25px}.field{border:1px solid #e4dbed;border-radius:9px;padding:13px;margin:12px 0}.field small{display:block;color:#9f8aac;font-size:10px;margin-bottom:7px}.field .value{display:flex;justify-content:space-between;gap:10px;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#30203f;color:white;padding:14px 20px;border-radius:10px;font-size:12px;z-index:20}.hidden{display:none}dialog{border:1px solid #ded0eb;border-radius:16px;padding:28px;width:min(500px,90vw)}dialog::backdrop{background:#30203f55}dialog textarea{width:100%;height:140px;border:1px solid #ddd0e8;border-radius:8px;padding:12px;line-height:1.6;margin:12px 0}.agency .pill{font-family:system-ui;font-size:10px}@media(max-width:850px){.grid,.agency .grid,.saas .body{grid-template-columns:1fr}.rail{display:none}.body,.modern .body,.agency .body{padding:24px}.modern .tiles{grid-template-columns:1fr}.agency .paper-row{grid-template-columns:1fr;gap:8px}.chat-user{margin-left:25px}h1,.modern h1,.agency h1{font-size:28px}.footer{flex-wrap:wrap}.tag{display:none}}
</style></head><body><header><div class="logo"><img src="../../assets/creative-ai-logo-02b.svg" alt="">Creative AI</div><span class="tag">BRIEF EXPERIENCE · FOUR ISOLATED CONCEPTS</span><a href="index.html" style="color:#8053a8;font-size:12px">Original experiment ↗</a></header><nav class="switcher" aria-label="Brief style"></nav><p class="description" id="description"></p><main id="mockup"></main><dialog id="edit"><form method="dialog"><h2>Correct the recommendation</h2><textarea id="value" aria-label="Recommendation"></textarea><div class="row"><button class="secondary" value="cancel">Cancel</button><button class="primary" value="save">Save changes</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const styles={agency:['Traditional agency','A structured creative brief: strategy first, with a clear proposition, proof and deliverables.'],modern:['Modern','A visual campaign canvas: one bold recommendation, with assets and details close by.'],ai:['AI-led','A conversational creative partner: it presents the plan and accepts natural-language corrections.'],saas:['SaaS','A guided workspace: recommended settings, editable fields and a persistent project summary.']};let active='agency',message='Choose the comfort that suits you.';const request='Introduce Airboost 6.8 to people comparing mattress comfort. Explain its firmness options and encourage product exploration.';const facts=()=>'<div class="facts"><div><small>PRODUCT</small>Duroflex · Airboost 6.8</div><div><small>OBJECTIVE · SUGGESTED</small>Product consideration</div><div><small>AUDIENCE · SUGGESTED</small>People comparing comfort & firmness</div><div><small>LANGUAGE / MARKET · SUGGESTED</small>English · Pan India</div><div><small>CTA · SUGGESTED</small>Explore Airboost 6.8</div></div>';const assets=()=>['Social post','Story','Website banner'].map((a,i)=>`<div class="asset"><i>${['▧','▯','▭'][i]}</i><div><strong>${a}</strong><small>${['Introduce the benefit','Explain the choice','Drive product exploration'][i]}</small></div><button class="text" data-remove aria-label="Remove ${a}">−</button></div>`).join('');const frameTop=()=>'<div class="topline"><span>New campaign / Recommended brief</span><span class="brand">DUROFLEX</span></div>';const footer=()=>'<div class="footer"><span class="muted">Illustrative plan · correct only what needs changing</span><button class="primary" data-review>Review brief →</button></div>';const safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('.switcher').innerHTML=Object.entries(styles).map(([id,[name]])=>`<button data-style="${id}" aria-pressed="${id===active}">${name}</button>`).join('');document.getElementById('description').textContent=styles[active][1];let body='';if(active==='agency')body=`<div class="body"><span class="eyebrow">Creative brief / 001</span><h1>Give comfort a clear point of view.</h1><p>Prepared for Duroflex · Product introduction</p><div class="grid"><section>${[['The assignment',request],['The objective','Build consideration by giving shoppers a concrete reason to explore.'],['Who we’re speaking to','People comparing mattress comfort and firmness.'],['Single-minded proposition',safe(message)],['Reason to believe','Two firmness options, supported by the selected product evidence.'],['Tone & response','Clear and reassuring. Invite people to explore the product.']].map(([k,v])=>`<div class="paper-row"><label>${k}</label><p>${v}${k==='Single-minded proposition'?'<br><button class="text" data-edit>Edit proposition</button>':''}</p></div>`).join('')}</section><aside><div class="box"><h2>Deliverables</h2>${assets()}<button class="text" data-add>＋ Add deliverable</button></div><div class="box"><h2>Requirements</h2><p class="muted">Use verified product facts, saved brand assets and each format’s placement rules. Preserve any supplied exact wording.</p></div></aside></div></div>`;
if(active==='modern')body=`<div class="body"><span class="eyebrow">Your next campaign</span><h1>Make comfort choice<br>the reason to explore.</h1><div class="grid"><section><div class="hero"><span class="pill">Recommended message</span><h1>${safe(message)}</h1><p>Lead with the firmness choice. Keep the mattress central and the next step simple.</p><button class="text" data-edit>Refine the message ↗</button></div><div class="row"><h2>A small set. A clear job for each.</h2><button class="text" data-add>＋ Add asset</button></div><div class="tiles">${['Social post','Story','Website banner'].map((a,i)=>`<div class="tile"><div class="visual">${['▧','▯','▭'][i]}</div><strong>${a}</strong><p class="muted">${['Introduce','Explain','Convert interest'][i]}</p></div>`).join('')}</div></section><aside><div class="box"><h2>Recommended details</h2>${facts()}<button class="text" data-details>Correct details</button></div><p class="muted">The insight: people comparing mattresses need a tangible difference to investigate.</p></aside></div></div>`;
if(active==='ai')body=`<div class="body"><div class="grid"><div class="conversation"><div class="chat-user">${request}</div><div class="assistant"><span class="spark">✦</span><section style="min-width:0;flex:1"><h1>I’d lead with comfort choice.</h1><p>It gives your audience a clear product difference to explore. Here’s the plan I recommend.</p><div class="box purple"><span class="eyebrow">Core message</span><h2 style="margin-top:12px">${safe(message)}</h2><button class="text" data-edit>Correct this</button></div><div class="box"><h2>Three assets, each with a purpose</h2>${assets()}<button class="text" data-add>＋ Add asset</button></div><p class="muted">I’ve suggested English, Pan India and one creative direction. You can correct any of these before creation.</p><div class="composer"><input id="chat" placeholder="Tell us what to change…" aria-label="Tell us what to change"><button class="primary" data-chat>↑</button></div></section></div></div><aside><div class="box"><h2>Your brief, understood</h2>${facts()}<button class="text" data-details>Correct details</button></div><span class="muted">Sample conversation · no AI requests</span></aside></div></div>`;
if(active==='saas')body=`<div class="body"><nav class="rail"><div>✓ Your request</div><div class="active">02 Strategy</div><div>03 Assets</div><div>04 Review</div></nav><section><span class="eyebrow">Step 2 of 4</span><h1>Your recommended strategy</h1><p class="muted">We’ve filled in the details from the sample brief. Adjust only what needs changing.</p>${[['Objective','Product consideration'],['Main message',safe(message)],['Audience','People comparing comfort and firmness'],['Features','Firm and medium-firm comfort options'],['Tone','Clear, reassuring and product-led'],['Language & market','English · Pan India']].map(([k,v])=>`<div class="field"><small>${k} <span class="pill">Suggested</span></small><div class="value"><span>${v}</span><button class="text" ${k==='Main message'?'data-edit':'data-details'}>Edit</button></div></div>`).join('')}<details><summary class="muted">Additional brief parameters</summary><p class="muted">Variant, exact wording, mandatory terms, destination, visual direction, people, viewing requirements and placement rules remain part of the full brief.</p></details></section><aside><div class="box"><h2>Project summary</h2><p class="muted">Duroflex · Airboost 6.8<br>One recommended direction</p>${assets()}<button class="text" data-add>＋ Add asset</button></div><div class="box purple"><h2>Why this plan?</h2><p class="muted">A specific comfort choice gives shoppers a clear reason to investigate.</p></div></aside></div>`;
document.getElementById('mockup').innerHTML=`<section class="frame ${active}">${frameTop()}${body}${footer()}</section>`;}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style){active=b.dataset.style;render();}if(b.hasAttribute('data-edit')){document.getElementById('value').value=message;document.getElementById('edit').showModal();}if(b.hasAttribute('data-remove'))b.closest('.asset').remove();if(b.hasAttribute('data-add'))toast('Prototype: this opens the suggested asset picker.');if(b.hasAttribute('data-details'))toast('Prototype: objective, audience, product and all other saved brief inputs remain editable.');if(b.hasAttribute('data-review'))toast('Prototype: review the complete brief before any paid generation.');if(b.hasAttribute('data-chat'))toast('Sample interaction: '+(document.getElementById('chat').value||'Describe a correction first.'));});document.getElementById('edit').addEventListener('close',e=>{if(e.target.returnValue==='save'){message=document.getElementById('value').value;render();}});render();
</script></body></html>
